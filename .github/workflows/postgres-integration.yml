name: PostgreSQL integration gate

on:
  push:
  pull_request:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client and live-test driver
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --no-save pg@8
      - name: Run dependency-free verification
        run: npm run verify
      - name: Run live PostgreSQL gate
        run: npm run test:postgres
